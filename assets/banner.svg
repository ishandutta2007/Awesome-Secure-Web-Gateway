<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Laser Beam Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0)" />
      <stop offset="50%" stop-color="rgba(56, 189, 248, 0.9)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }
    @keyframes scan {
      0% { transform: translateY(-60px); }
      100% { transform: translateY(60px); }
    }
    .floating-graphic { animation: float 4s ease-in-out infinite; }
    .laser-scanner { animation: scan 3.5s ease-in-out infinite alternate; }
    .pulse-node { animation: pulse 2.5s ease-in-out infinite; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 12px; fill: #38bdf8; letter-spacing: 1.5px; }
    .main-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; letter-spacing: -0.5px; }
    .gradient-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; fill: url(#accentGrad); letter-spacing: -0.5px; }
    .sub-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 15px; fill: #94a3b8; }
    .pill-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 12px; }
    .node-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; fill: #f8fafc; text-anchor: middle; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Cyber Grid Matrix (Background) -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <path d="M 0,80 L 1200,80 M 0,160 L 1200,160 M 0,240 L 1200,240 M 0,320 L 1200,320" />
    <path d="M 150,0 L 150,400 M 300,0 L 300,400 M 450,0 L 450,400 M 600,0 L 600,400 M 750,0 L 750,400 M 900,0 L 900,400 M 1050,0 L 1050,400" />
  </g>

  <!-- Ambient Background Glows -->
  <circle cx="950" cy="200" r="180" fill="#38bdf8" opacity="0.06" filter="url(#softGlow)" />
  <circle cx="200" cy="100" r="140" fill="#818cf8" opacity="0.04" filter="url(#softGlow)" />

  <!-- ================= LEFT CONTENT GROUP ================= -->
  <g transform="translate(60, 60)">
    <!-- Top Category Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="290" height="28" rx="14" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="16" cy="14" r="4" fill="#38bdf8" filter="url(#glow)" />
      <text x="30" y="18" class="badge-text">SECURE WEB GATEWAY &amp; SSE ECOSYSTEM</text>
    </g>

    <!-- Main Heading -->
    <text x="0" y="76" class="main-title">Awesome Secure</text>
    <text x="0" y="122" class="gradient-title" filter="url(#glow)">Web Gateway 🛡️</text>

    <!-- Subtitle Description -->
    <text x="0" y="166" class="sub-text">Curated Enterprise SaaS Platforms &amp; Open-Source Security Tools</text>
    <text x="0" y="190" class="sub-text">Cloud Web Security • HTTPS Inspection • CASB • SASE / SSE</text>

    <!-- Feature Pill Badges -->
    <g transform="translate(0, 222)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="140" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="70" y="20" class="pill-text" fill="#38bdf8" text-anchor="middle">🛡️ SSL Inspection</text>

      <!-- Pill 2 -->
      <rect x="150" y="0" width="140" height="32" rx="16" fill="#0f172a" stroke="#a855f7" stroke-width="1" />
      <text x="220" y="20" class="pill-text" fill="#c084fc" text-anchor="middle">🌐 URL Filtering</text>

      <!-- Pill 3 -->
      <rect x="300" y="0" width="135" height="32" rx="16" fill="#0f172a" stroke="#34d399" stroke-width="1" />
      <text x="367" y="20" class="pill-text" fill="#34d399" text-anchor="middle">⚡ SASE / SSE</text>

      <!-- Pill 4 -->
      <rect x="445" y="0" width="135" height="32" rx="16" fill="#0f172a" stroke="#f472b6" stroke-width="1" />
      <text x="512" y="20" class="pill-text" fill="#f472b6" text-anchor="middle">🔒 Cloud CASB</text>
    </g>
  </g>

  <!-- ================= RIGHT GRAPHIC GROUP (SHIELD & GATEWAY) ================= -->
  <g transform="translate(950, 200)" class="floating-graphic">
    <!-- Outer Decorative Radar Rings -->
    <circle r="140" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.6" />
    <circle r="115" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />

    <!-- Main Gateway Shield -->
    <g transform="translate(-100, -115)">
      <!-- Outer Shield Glow Path -->
      <path d="M 100,10 L 190,45 V 115 C 190,175 100,215 100,215 C 100,215 10,175 10,115 V 45 Z" 
            fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="3" filter="url(#glow)" />
      
      <!-- Inner Shield Inset -->
      <path d="M 100,24 L 178,54 V 115 C 178,165 100,200 100,200 C 100,200 22,165 22,115 V 54 Z" 
            fill="#090d16" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />

      <!-- Center Shield Network Grid & Core -->
      <circle cx="100" cy="70" r="12" fill="#38bdf8" opacity="0.9" filter="url(#glow)" />
      <path d="M 100,82 V 145 M 60,110 H 140" stroke="#38bdf8" stroke-width="2" opacity="0.6" />

      <!-- Core Nodes inside Shield -->
      <circle cx="60" cy="110" r="9" fill="#10b981" />
      <circle cx="140" cy="110" r="9" fill="#f43f5e" />
      <circle cx="100" cy="145" r="10" fill="#a855f7" />

      <!-- Laser Scanner Effect inside Shield -->
      <g class="laser-scanner">
        <line x1="15" y1="115" x2="185" y2="115" stroke="url(#laserGrad)" stroke-width="4" />
        <line x1="15" y1="115" x2="185" y2="115" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />
      </g>
    </g>

    <!-- Satellite Security Feature Nodes -->
    <!-- Top Satellite: Cloud Proxy -->
    <g transform="translate(0, -145)">
      <rect x="-45" y="-14" width="90" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)" />
      <text y="4" class="node-text">☁️ Proxy</text>
    </g>

    <!-- Right Satellite: Zero Trust -->
    <g transform="translate(130, 0)">
      <rect x="-50" y="-14" width="100" height="28" rx="14" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" filter="url(#glow)" />
      <text y="4" class="node-text">🔒 Zero Trust</text>
    </g>

    <!-- Bottom Satellite: HTTPS Scan -->
    <g transform="translate(0, 145)">
      <rect x="-55" y="-14" width="110" height="28" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5" filter="url(#glow)" />
      <text y="4" class="node-text">🔑 HTTPS Scan</text>
    </g>

    <!-- Left Satellite: DLP -->
    <g transform="translate(-130, 0)">
      <rect x="-40" y="-14" width="80" height="28" rx="14" fill="#0f172a" stroke="#f472b6" stroke-width="1.5" filter="url(#glow)" />
      <text y="4" class="node-text">🛡️ DLP</text>
    </g>

    <!-- Connecting Rays from Satellite Nodes to Center Shield -->
    <line x1="0" y1="-131" x2="0" y2="-115" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7" />
    <line x1="80" y1="0" x2="116" y2="0" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7" />
    <line x1="0" y1="115" x2="0" y2="131" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7" />
    <line x1="-116" y1="0" x2="-80" y2="0" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7" />
  </g>
</svg>
