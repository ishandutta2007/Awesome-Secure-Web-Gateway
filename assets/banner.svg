<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient><linearGradient id="laserGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="rgba(56, 189, 248, 0)"/><stop offset="50%" stop-color="rgba(56, 189, 248, 0.9)"/><stop offset="100%" stop-color="rgba(56, 189, 248, 0)"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes scan{0%{transform:translateY(-40px)}}.laser-beam{animation:scan 3s ease-in-out infinite alternate}.floating-shield{animation:float 4s ease-in-out infinite}.badge-text{font-weight:700;font-size:13px;fill:#38bdf8;letter-spacing:1px}.badge-text,.sub-text,.title-text{font-family:system-ui,-apple-system,sans-serif}.title-text{font-weight:800;font-size:42px;fill:#fff;letter-spacing:-.5px}.sub-text{font-weight:400;font-size:17px;fill:#94a3b8}</style><rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/><g stroke="#334155" stroke-width="1" opacity=".12"><path d="M 0,80 L 1200,80 M 0,160 L 1200,160 M 0,240 L 1200,240 M 0,320 L 1200,320"/><path d="M 200,0 L 200,400 M 400,0 L 400,400 M 600,0 L 600,400 M 800,0 L 800,400 M 1000,0 L 1000,400"/></g><g transform="translate(70, 75)"><rect width="280" height="28" x="0" y="0" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="1.2" rx="14"/><circle cx="16" cy="14" r="4" fill="#38bdf8" filter="url(#glow)"/><text x="30" y="18" class="badge-text">SECURE WEB GATEWAY ECOSYSTEM</text><text x="0" y="75" class="title-text" filter="url(#glow)">Awesome Secure</text><text x="0" y="120" class="title-text" filter="url(#glow)">Web Gateway 🛡️</text><text x="0" y="162" class="sub-text">Curated SaaS Platforms &amp; Open-Source Security Tools,</text><text x="0" y="186" class="sub-text">Cloud Web Security, HTTPS Inspection, CASB &amp; SASE/SSE</text><g transform="translate(0, 218)"><rect width="140" height="32" x="0" y="0" fill="#0f172a" stroke="#38bdf8" stroke-width="1" rx="16"/><text x="70" y="20" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">🛡️ SSL Inspection</text><rect width="140" height="32" x="152" y="0" fill="#0f172a" stroke="#a855f7" stroke-width="1" rx="16"/><text x="222" y="20" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">🌐 URL Filtering</text><rect width="140" height="32" x="304" y="0" fill="#0f172a" stroke="#4facfe" stroke-width="1" rx="16"/><text x="374" y="20" fill="#4facfe" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ SASE / SSE</text></g></g><g class="floating-shield" transform="translate(920, 65)"><path fill="#0b1329" stroke="#38bdf8" stroke-width="3" d="M 130,10 L 240,50 V 130 C 240,200 130,250 130,250 C 130,250 20,200 20,130 V 50 Z" filter="url(#glow)"/><path fill="#0f172a" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" d="M 130,25 L 225,60 V 130 C 225,188 130,230 130,230 C 130,230 35,188 35,130 V 60 Z"/><circle cx="130" cy="80" r="14" fill="#38bdf8" filter="url(#glow)" opacity=".9"/><path stroke="#38bdf8" stroke-width="2" d="M 130,94 V 160 M 80,120 H 180" opacity=".6"/><circle cx="80" cy="120" r="10" fill="#22c55e"/><circle cx="180" cy="120" r="10" fill="#ef4444"/><circle cx="130" cy="160" r="12" fill="#a855f7"/><g class="laser-beam"><line x1="20" x2="240" y1="130" y2="130" stroke="url(#laserGrad)" stroke-width="4"/><line x1="20" x2="240" y1="130" y2="130" stroke="#fff" stroke-width="1.5" opacity=".9"/></g></g></svg>